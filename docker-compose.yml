version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: agent_studio_db
    restart: always
    environment:
      POSTGRES_DB: agent_studio
      POSTGRES_USER: agent_admin
      POSTGRES_PASSWORD: AgentStudioSecurePassword2026!
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_admin -d agent_studio"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agent_studio_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://agent_admin:AgentStudioSecurePassword2026!@db:5432/agent_studio
      SECRET_KEY: agent-studio-super-secret-jwt-key-2026-production-ready
      ENCRYPTION_MASTER_KEY: agent-studio-master-encryption-key-32-chars!!
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads

volumes:
  pgdata:
    driver: local
