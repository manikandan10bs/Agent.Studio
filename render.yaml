services:
  - type: web
    name: agent-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_MASTER_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./agent_studio.db
      - key: STORAGE_DIR
        value: /app/uploads
      - key: USE_FIRESTORE
        value: "false"
      - key: DEFAULT_ADMIN_EMAIL
        value: admin@agent.studio
      - key: DEFAULT_ADMIN_PASSWORD
        value: Admin@Studio2026
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
