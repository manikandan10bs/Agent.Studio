services:
  - type: web
    name: agent-studio-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FIREBASE_PROJECT_ID
        value: agent-studio-def1d
      - key: USE_FIRESTORE
        value: "true"
      - key: DEFAULT_ADMIN_EMAIL
        value: manikandan10bs@gmail.com
      - key: FRONTEND_URL
        value: https://agent-studio-def1d.web.app
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_MASTER_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
